[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "BLE", "TRY004", "LOG015"]

[tool.ruff.lint.per-file-ignores]
"agent/tool_registry.py" = ["BLE001"]
"application/flight_views.py" = ["BLE001"]
"bot/flight_browser.py" = ["BLE001"]
"bot/ground_turns.py" = ["BLE001"]
"services/ai_analysis.py" = ["BLE001"]
"services/analytics_report.py" = ["BLE001"]
"services/flight_foreflight.py" = ["BLE001"]
"services/snapshot.py" = ["BLE001"]
